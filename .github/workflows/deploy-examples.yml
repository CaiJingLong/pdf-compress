name: Deploy Examples

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-examples
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Prepare static examples
        run: |
          rm -rf _site
          mkdir -p _site/examples _site/dist _site/assets

          cp -R examples/browser-global _site/examples/browser-global
          cp -R examples/browser-esm _site/examples/browser-esm
          cp -R examples/shared _site/examples/shared
          cp -R assets/samples _site/assets/samples
          cp dist/browser.js _site/dist/browser.js
          cp dist/pdf-compress.global.js _site/dist/pdf-compress.global.js
          touch _site/.nojekyll

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>@caijinglong/pdf-compress examples</title>
              <style>
                :root {
                  color-scheme: light;
                  --bg: #f7f7f2;
                  --text: #172220;
                  --muted: #5c6f68;
                  --line: #d9ddd0;
                  --accent: #2d6a4f;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  background: var(--bg);
                  color: var(--text);
                  font-family: Avenir Next, Segoe UI, sans-serif;
                }

                main {
                  width: min(760px, calc(100% - 32px));
                  margin: 0 auto;
                  padding: 56px 0;
                }

                h1 {
                  margin: 0 0 12px;
                  font-size: 40px;
                  line-height: 1.1;
                }

                p {
                  margin: 0 0 28px;
                  color: var(--muted);
                  line-height: 1.6;
                }

                nav {
                  display: grid;
                  gap: 12px;
                }

                a {
                  display: block;
                  padding: 16px 18px;
                  border: 1px solid var(--line);
                  border-radius: 8px;
                  background: #fff;
                  color: var(--accent);
                  font-weight: 700;
                  text-decoration: none;
                }

                a:hover {
                  border-color: var(--accent);
                }
              </style>
            </head>
            <body>
              <main>
                <h1>@caijinglong/pdf-compress examples</h1>
                <p>Static browser examples published from the latest main branch build.</p>
                <nav aria-label="Examples">
                  <a href="./examples/browser-global/">Browser Global Example</a>
                  <a href="./examples/browser-esm/">Browser ESM Example</a>
                </nav>
              </main>
            </body>
          </html>
          HTML

      - name: Deploy to gh-pages
        run: |
          cd _site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "deploy examples"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
