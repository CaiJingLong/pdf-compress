<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@caijinglong/pdf-compress examples</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f2;
        --text: #172220;
        --muted: #5c6f68;
        --line: #d9ddd0;
        --accent: #2d6a4f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Avenir Next, Segoe UI, sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 40px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>@caijinglong/pdf-compress examples</h1>
      <p>Static browser examples published from the latest main branch build.</p>
      <nav aria-label="Examples">
        <a href="./examples/browser-global/">Browser Global Example</a>
        <a href="./examples/browser-esm/">Browser ESM Example</a>
      </nav>
    </main>
  </body>
</html>
